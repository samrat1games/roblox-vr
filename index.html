  .download:focus-visible { outline: 3px solid #8aa3ff; outline-offset: 4px; }

  .download.alt:hover { background: #2c3039; }
  .meta { margin: 0; color: var(--muted); font-size: 14px; }
  footer { padding-block: 20px; text-align: center; color: #6b7079; font-size: 12px; }
  @media (prefers-reduced-motion: reduce) { .download { transition: none; } }
