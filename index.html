<script>
  const T = {
    ru: {
      sub: "По праздникам 1 фпс",
      warn: "<b>Альфа-версия.</b> В ней есть баги: возможны вылеты, просадки FPS и неточное управление. Мы работаем над исправлениями.",

    },

      foot: "Projeto não oficial, sem relação com a Roblox Corporation."
    }
  };
  function pick() {
    try { const s = localStorage.getItem("lang"); if (s && T[s]) return s; } catch (e) {}
    const n = (navigator.language || "en").toLowerCase();
    return n.startsWith("ru") ? "ru" : n.startsWith("pt") ? "pt" : "en";
  }
  function setLang(l) {
    document.documentElement.lang = l === "pt" ? "pt-BR" : l;
    document.querySelectorAll("[data-i]").forEach(el => { el.innerHTML = T[l][el.dataset.i]; });
    document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
    try { localStorage.setItem("lang", l); } catch (e) {}
  }
  document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
  setLang(pick());
</script>
